name: Verify prompt predictions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
        working-directory: packages/app
      - name: Composer browser suite
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4311'
        run: bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts --workers=3 --retries=0
        working-directory: packages/app
      - name: Repeat prediction regressions
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4312'
          PLAYWRIGHT_FULLY_PARALLEL: '1'
        run: bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts -g 'prediction|predicts a follow-up' --repeat-each=10 --workers=5 --retries=0
        working-directory: packages/app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prediction-verification
          path: |
            ${{ runner.temp }}/*benchmark.log
            ${{ runner.temp }}/prediction-red.log
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
