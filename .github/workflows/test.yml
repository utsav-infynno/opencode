name: Verify prompt predictions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: composer-predictions
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
        working-directory: packages/app
      - name: Baseline regression and benchmark
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4310'
          OPENCODE_PERFORMANCE: '1'
        run: |
          git restore --source=cc3638d7d802b67aa6f9c8217299d37720030032 -- packages/app/src
          cd packages/app
          set +e
          bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts -g 'normalizes prediction replies|only the visible focused window|empty, oversized' --workers=1 --retries=0 > "$RUNNER_TEMP/prediction-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/prediction-red.log"
          test "$status" -ne 0
          grep -F "3 failed" "$RUNNER_TEMP/prediction-red.log"
          bun node_modules/@playwright/test/cli.js test --config e2e/performance/playwright.config.ts timeline/session-entry-benchmark.spec.ts -g 'cold session' --repeat-each=3 --workers=1 --retries=0 | tee "$RUNNER_TEMP/baseline-benchmark.log"
      - name: Restore candidate
        if: always()
        run: git restore --source=HEAD -- packages/app/src
      - name: Composer browser suite
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4311'
        run: bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts --workers=3 --retries=0
        working-directory: packages/app
      - name: Repeat prediction regressions
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4312'
          PLAYWRIGHT_FULLY_PARALLEL: '1'
        run: bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts -g 'prediction|predicts a follow-up' --repeat-each=10 --workers=5 --retries=0
        working-directory: packages/app
      - name: Candidate benchmark
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4313'
          OPENCODE_PERFORMANCE: '1'
        run: bun node_modules/@playwright/test/cli.js test --config e2e/performance/playwright.config.ts timeline/session-entry-benchmark.spec.ts -g 'cold session' --repeat-each=3 --workers=1 --retries=0 | tee "$RUNNER_TEMP/candidate-benchmark.log"
        working-directory: packages/app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prediction-verification
          path: |
            ${{ runner.temp }}/*benchmark.log
            ${{ runner.temp }}/prediction-red.log
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
