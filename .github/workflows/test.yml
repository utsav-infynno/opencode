name: Verify prompt predictions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
        working-directory: packages/app
      - name: Verify the regression fails on the unchanged app
        env:
          PLAYWRIGHT_BUILD: '1'
          PLAYWRIGHT_PORT: '4310'
        run: |
          git restore --source=63c1a27af5a391d9caa55b82694f496911e1859b -- packages/app/src
          cd packages/app
          set +e
          bun node_modules/@playwright/test/cli.js test e2e/regression/composer.spec.ts -g 'predicts a follow-up after completion' --workers=1 --retries=0 > "$RUNNER_TEMP/prediction-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/prediction-red.log"
          test "$status" -ne 0
          grep -F "Add a regression test for empty input." "$RUNNER_TEMP/prediction-red.log"
          grep -F "Expected: visible" "$RUNNER_TEMP/prediction-red.log"
          grep -F "1 failed" "$RUNNER_TEMP/prediction-red.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prediction-verification
          path: |
            ${{ runner.temp }}/*benchmark.log
            ${{ runner.temp }}/prediction-red.log
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
